<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- PROTECTED: meta type -->
    <meta name="type" value="app" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARFLOW — операционная система импортёра автомобилей</title>
    <meta property="og:title" content="CARFLOW">
    <meta property="og:description" content="SaaS-платформа для контроля закупки, логистики, документов и финансов при импорте автомобилей из Китая.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        :root{
            --bg:#F4F6F8; --dark:#101820; --dark2:#182229; --card:#FFFFFF; --border:#E0E5E9;
            --text:#141A21; --secondary:#7F8A96; --accent:#D9611E; --accent-dark:#B94F16; --accent-soft:#FCE8DC;
            --green:#15803D; --green-soft:#E6F4EA; --red:#B91C1C; --red-soft:#FBEAEA;
            --blue:#2E6FD9; --blue-soft:#EAF1FC; --amber:#B07C00; --amber-soft:#FBF3D9;
            --radius:9px;
        }
        *{box-sizing:border-box;}
        html,body{margin:0;padding:0;}
        body{
            font-family:'Inter',system-ui,-apple-system,sans-serif;
            background:var(--bg); color:var(--text); font-size:14px; line-height:1.55;
            -webkit-font-smoothing:antialiased;
        }
        a{color:inherit; text-decoration:none;}
        button{font-family:inherit; cursor:pointer;}
        input,select,textarea{font-family:inherit; font-size:13.5px;}
        ::selection{background:var(--accent-soft);}
        #app{min-height:100vh;}
        .scrollbar::-webkit-scrollbar{width:8px;height:8px;}
        .scrollbar::-webkit-scrollbar-thumb{background:#d5dade;border-radius:8px;}

        /* ===== AUTH ===== */
        .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
        .auth-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:36px 32px;}
        .auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
        .auth-logo .box{width:34px;height:34px;border-radius:8px;background:var(--dark);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;}
        .auth-logo span{font-weight:800;font-size:18px;letter-spacing:.5px;}
        .auth-card h1{font-size:19px;font-weight:700;margin:0 0 4px;}
        .auth-card p.sub{color:var(--secondary);margin:0 0 24px;font-size:13px;}
        .field{margin-bottom:14px;}
        .field label{display:block;font-size:12px;font-weight:600;color:var(--secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px;}
        .field input, .field select, .field textarea{
            width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);outline:none;transition:.2s;
        }
        .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:7px;border:1px solid transparent;font-weight:600;font-size:13.5px;transition:.2s;}
        .btn-primary{background:var(--dark);color:#fff;}
        .btn-primary:hover{background:#1c2830;}
        .btn-accent{background:var(--accent);color:#fff;}
        .btn-accent:hover{background:var(--accent-dark);}
        .btn-ghost{background:transparent;border-color:var(--border);color:var(--text);}
        .btn-ghost:hover{background:#f2f3f4;}
        .btn-block{width:100%;}
        .btn-sm{padding:6px 11px;font-size:12.5px;}
        .auth-switch{margin-top:18px;text-align:center;font-size:13px;color:var(--secondary);}
        .auth-switch b{color:var(--accent);cursor:pointer;font-weight:600;}
        .auth-demo{margin-top:16px;padding:10px 12px;background:var(--bg);border:1px dashed var(--border);border-radius:7px;font-size:12px;color:var(--secondary);}
        .err-msg{background:var(--red-soft);color:var(--red);padding:8px 10px;border-radius:7px;font-size:12.5px;margin-bottom:12px;}

        /* ===== SHELL ===== */
        .shell{display:flex;min-height:100vh;}
        .sidebar{width:232px;background:var(--dark);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;}
        .sb-logo{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid #22303a;}
        .sb-logo .box{width:30px;height:30px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0;}
        .sb-logo span{font-weight:800;font-size:16px;letter-spacing:.4px;color:#fff;}
        .sb-ws{padding:12px 18px;border-bottom:1px solid #22303a;}
        .sb-ws-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:7px;background:#182229;border:1px solid #24323c;color:#fff;}
        .sb-ws-btn .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
        .sb-ws-btn .info{display:flex;flex-direction:column;text-align:left;flex:1;overflow:hidden;}
        .sb-ws-btn .info b{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sb-ws-btn .info small{font-size:10.5px;color:#8b9aa5;}
        .sb-nav{flex:1;padding:14px 10px;overflow-y:auto;}
        .sb-nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:7px;color:#a9b4bd;font-size:13px;font-weight:500;margin-bottom:2px;transition:.15s;}
        .sb-nav a i{width:16px;text-align:center;color:#7c8b96;font-size:14px;}
        .sb-nav a:hover{background:#182229;color:#fff;}
        .sb-nav a.active{background:#1c2830;color:#fff;}
        .sb-nav a.active i{color:var(--accent);}
        .sb-foot{padding:10px;border-top:1px solid #22303a;}
        .sb-foot a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:7px;color:#a9b4bd;font-size:13px;font-weight:500;}
        .sb-foot a i{width:16px;text-align:center;color:#7c8b96;font-size:13px;}
        .sb-foot a:hover{background:#182229;color:#fff;}
        .sb-user{display:flex;align-items:center;gap:9px;padding:9px 12px;}
        .sb-user .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
        .sb-user .info{flex:1;overflow:hidden;}
        .sb-user .info b{display:block;font-size:12.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sb-user .info small{font-size:10.5px;color:#8b9aa5;}
        .sb-user i.fa-arrow-right-from-bracket{color:#8b9aa5;cursor:pointer;}

        .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;}
        .topbar{position:sticky;top:0;background:rgba(244,246,248,.9);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);}
        .search-trigger{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--secondary);font-size:13px;width:280px;}
        .search-trigger kbd{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--secondary);margin-left:auto;}
        .topbar-right{display:flex;align-items:center;gap:14px;}
        .icon-btn{position:relative;width:34px;height:34px;border-radius:7px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--secondary);}
        .icon-btn:hover{background:#f2f3f4;color:var(--text);}
        .icon-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font-size:9.5px;border-radius:8px;padding:1px 5px;font-weight:700;}
        .content{padding:26px 28px 60px;max-width:1320px;width:100%;margin:0 auto;}

        h1.page-title{font-size:21px;font-weight:800;margin:0 0 4px;}
        p.page-sub{color:var(--secondary);margin:0 0 22px;font-size:13.5px;}
        .row-between{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:14px;flex-wrap:wrap;}

        /* ===== CARDS/GRID ===== */
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
        .grid{display:grid;gap:14px;}
        .grid-4{grid-template-columns:repeat(4,1fr);}
        .grid-3{grid-template-columns:repeat(3,1fr);}
        .grid-2{grid-template-columns:repeat(2,1fr);}
        @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

        .capital-card{background:var(--dark);color:#fff;border-radius:12px;padding:24px 26px;margin-bottom:18px;}
        .capital-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
        .capital-top .lbl{font-size:11.5px;letter-spacing:.6px;color:#8b9aa5;font-weight:700;text-transform:uppercase;}
        .capital-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
        .capital-grid .num{font-size:24px;font-weight:800;color:#fff;margin-bottom:3px;}
        .capital-grid .lb{font-size:12px;color:#8b9aa5;}
        .capital-grid .num.accent{color:var(--accent);}
        @media(max-width:900px){.capital-grid{grid-template-columns:repeat(2,1fr);gap:16px;}}

        .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
        .kpi-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
        .kpi-card .top i{color:var(--secondary);font-size:13px;}
        .kpi-card .num{font-size:26px;font-weight:800;}
        .kpi-card .lb{color:var(--secondary);font-size:12.5px;margin-top:2px;}

        .section-title{font-size:14px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
        .section-title i{color:var(--accent);font-size:13px;}

        .list-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
        .list-row:last-child{border-bottom:none;}
        .list-row .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
        .list-row .txt b{font-weight:600;font-size:13px;}
        .list-row .txt div.meta{color:var(--secondary);font-size:12px;margin-top:2px;}
        .list-row .time{color:var(--secondary);font-size:11.5px;white-space:nowrap;margin-left:auto;}

        /* ===== TABLE ===== */
        .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff;}
        table{width:100%;border-collapse:collapse;font-size:13px;}
        thead th{text-align:left;padding:11px 14px;background:#FAFBFC;color:var(--secondary);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
        thead th:hover{color:var(--text);}
        tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
        tbody tr:last-child td{border-bottom:none;}
        tbody tr{transition:.15s;}
        tbody tr.clickable:hover{background:#FAFBFC;cursor:pointer;}
        .cell-strong{font-weight:600;}
        .cell-sub{color:var(--secondary);font-size:12px;}
        .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;}

        .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;}
        .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}

        .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
        .toolbar input, .toolbar select{padding:8px 11px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);font-size:13px;}
        .toolbar input[type="text"]{min-width:220px;}
        .pagination{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12.5px;color:var(--secondary);}
        .pagination .pg-btns{display:flex;gap:6px;}
        .pagination button{border:1px solid var(--border);background:#fff;border-radius:6px;width:28px;height:28px;color:var(--text);}
        .pagination button:disabled{opacity:.4;cursor:default;}
        .pagination button.active{background:var(--dark);color:#fff;border-color:var(--dark);}

        /* ===== MODAL ===== */
        .modal-overlay{position:fixed;inset:0;background:rgba(16,24,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
        .modal-box{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;}
        .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
        .modal-head h3{margin:0;font-size:16px;font-weight:700;}
        .modal-head i{color:var(--secondary);cursor:pointer;}
        .modal-body{padding:20px 22px;}
        .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
        .form-grid .full{grid-column:1/-1;}
        .form-section-lbl{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--secondary);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 -2px;}

        /* toast */
        .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
        .toast{background:var(--dark);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 20px rgba(0,0,0,.15);animation:slidein .2s ease;}
        .toast i{color:var(--accent);}
        @keyframes slidein{from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);}}

        /* ===== VEHICLE DETAIL ===== */
        .veh-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
        .veh-head h1{font-size:23px;font-weight:800;margin:0 0 6px;}
        .veh-head .metas{display:flex;gap:16px;color:var(--secondary);font-size:13px;flex-wrap:wrap;}
        .veh-head .metas b{color:var(--text);font-weight:600;}
        .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;}
        .tabs button{background:none;border:none;padding:10px 16px;font-size:13px;font-weight:600;color:var(--secondary);border-bottom:2px solid transparent;}
        .tabs button.active{color:var(--text);border-color:var(--accent);}

        .fin-card{text-align:left;}
        .fin-card .lb{color:var(--secondary);font-size:12px;margin-bottom:4px;}
        .fin-card .val{font-size:20px;font-weight:800;}
        .fin-card .val.green{color:var(--green);}

        .timeline{position:relative;padding-left:26px;}
        .timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border);}
        .t-item{position:relative;padding-bottom:22px;}
        .t-item:last-child{padding-bottom:0;}
        .t-item::before{content:'';position:absolute;left:-26px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--border);}
        .t-item.done::before{border-color:var(--green);background:var(--green);}
        .t-item.current::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
        .t-item b{font-size:13.5px;font-weight:700;}
        .t-item .meta{color:var(--secondary);font-size:12px;margin-top:3px;}
        .t-item.pending b, .t-item.pending .meta{color:#b7bfc6;}

        .doc-row, .exp-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);gap:12px;}
        .doc-row:last-child, .exp-row:last-child{border-bottom:none;}
        .doc-icon{width:34px;height:34px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--secondary);flex-shrink:0;}

        /* ===== MAP ===== */
        .map-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:26px;overflow-x:auto;}
        .map-legend{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
        .map-legend button{padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--secondary);}
        .map-legend button.active{background:var(--dark);color:#fff;border-color:var(--dark);}

        /* ===== TRACKING PUBLIC ===== */
        .track-wrap{min-height:100vh;background:var(--bg);}
        .track-top{background:var(--dark);color:#fff;padding:22px 0;}
        .track-top .inner{max-width:720px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:10px;}
        .track-container{max-width:720px;margin:0 auto;padding:32px 20px 60px;}
        .track-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:28px;margin-bottom:18px;}

        .empty-state{text-align:center;padding:50px 20px;color:var(--secondary);}
        .empty-state i{font-size:28px;margin-bottom:12px;color:#c7ccd1;display:block;}

        @media(max-width:900px){
            .sidebar{position:fixed;left:-232px;transition:.25s;z-index:150;}
            .sidebar.open{left:0;}
            .content{padding:18px 16px 60px;}
            .form-grid{grid-template-columns:1fr;}
            .search-trigger{width:auto;}
            .mobile-toggle{display:flex !important;}
        }
        .mobile-toggle{display:none;width:34px;height:34px;border-radius:7px;border:1px solid var(--border);background:#fff;align-items:center;justify-content:center;color:var(--text);}
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="toast-wrap" id="toastWrap"></div>
    <script>
    /* ========================================================
       CARFLOW — client-side SPA MVP (localStorage as datastore)
       ======================================================== */

    const LS_KEY='carflow_db_v2';
    let DB=null;

    const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
    const now=()=>new Date().toISOString();
    const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    const pick=arr=>arr[rnd(0,arr.length-1)];
    const daysAgo=n=>new Date(Date.now()-n*86400000).toISOString();
    const daysFromNow=n=>new Date(Date.now()+n*86400000).toISOString();
    const fmtMoney=(n,cur='₸')=>{n=Math.round(n||0); return n.toLocaleString('ru-RU')+' ₽';};
    const fmtDate=(d)=>{ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'});};
    const fmtDateTime=(d)=>{ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'})+' в '+dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});};
    const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function toast(msg,icon='circle-check'){
        const w=document.getElementById('toastWrap');
        const el=document.createElement('div');
        el.className='toast';
        el.innerHTML=`<i class="fa-solid fa-${icon}"></i><span>${esc(msg)}</span>`;
        w.appendChild(el);
        setTimeout(()=>el.remove(),3200);
    }

    /* ---------- constants ---------- */
    const STATUS_META={
        PURCHASED:{label:'Закуплен',color:'#7F8A96',bg:'#F1F2F3'},
        AT_CHINA_WAREHOUSE:{label:'Склад в Китае',color:'#B07C00',bg:'#FBF3D9'},
        LOADED:{label:'Загружен',color:'#B07C00',bg:'#FBF3D9'},
        EXPORT_PROCESSING:{label:'Экспортное оформление',color:'#B07C00',bg:'#FBF3D9'},
        DEPARTED_CHINA:{label:'Покинул Китай',color:'#2E6FD9',bg:'#EAF1FC'},
        IN_TRANSIT:{label:'В пути',color:'#2E6FD9',bg:'#EAF1FC'},
        ARRIVED_RUSSIA:{label:'Прибыл во Владивосток',color:'#2E6FD9',bg:'#EAF1FC'},
        CUSTOMS:{label:'Таможня',color:'#C2410C',bg:'#FDECE1'},
        CUSTOMS_RELEASED:{label:'Таможня завершена',color:'#15803D',bg:'#E6F4EA'},
        RAIL_TRANSIT:{label:'ЖД транзит',color:'#2E6FD9',bg:'#EAF1FC'},
        LOCAL_DELIVERY:{label:'Локальная доставка',color:'#2E6FD9',bg:'#EAF1FC'},
        READY:{label:'Готов к выдаче',color:'#15803D',bg:'#E6F4EA'},
        DELIVERED:{label:'Выдан клиенту',color:'#15803D',bg:'#E6F4EA'},
        BLOCKED:{label:'Блокирован',color:'#B91C1C',bg:'#FBEAEA'},
    };
    const TIMELINE_STEPS=['PURCHASED','AT_CHINA_WAREHOUSE','LOADED','EXPORT_PROCESSING','DEPARTED_CHINA','IN_TRANSIT','ARRIVED_RUSSIA','CUSTOMS','CUSTOMS_RELEASED','RAIL_TRANSIT','LOCAL_DELIVERY','READY','DELIVERED'];
    const TIMELINE_LABELS={
        PURCHASED:'Автомобиль приобретён', AT_CHINA_WAREHOUSE:'Прибыл на склад в Китае', LOADED:'Загружен в контейнер',

    /* ---------- persistence ---------- */
    function loadDB(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; } }
    function saveDB(){ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
    function initDB(){

        if(existing){ DB=existing; return; }
        DB=seedDB();
        saveDB();
    }

    function seedDB(){
        const orgId=uid();
        const userId=uid();
        const db={
            organizations:[{id:orgId,name:'Carflow Import',created_at:now(),notifications:{inapp:true,telegram:false,email:false}}],
            users:[{id:userId,organization_id:orgId,name:'Ахмад Каримов',email:'demo@carflow.app',password:'demo123',role:'OWNER',created_at:now()}],
            session:null,
            vehicles:[], statusHistory:[], shipments:[], containers:[], events:[],
            expenses:[], documents:[], customers:[], notifications:[], auditLogs:[], trackingLinks:[]
        };
        // customers
        for(let i=0;i<20;i++){
            const type=pick(['PRIVATE','PRIVATE','PRIVATE','DEALER','CORPORATE']);
            db.customers.push({
                id:uid(), organization_id:orgId, name:CUSTOMER_NAMES[i], type,
                phone:'+7 9'+rnd(10,79)+' '+rnd(100,999)+'-'+rnd(10,99)+'-'+rnd(10,99),
                email:'client'+i+'@mail.ru', manager:pick(MANAGERS),
                created_at:daysAgo(rnd(5,200))
            });
        }
        // shipments + containers
        const routes=[['Гуанчжоу','Владивосток'],['Шанхай','Владивосток'],['Нинбо','Владивосток'],['Тяньцзинь','Владивосток']];
        for(let i=0;i<10;i++){
            const [from,to]=pick(routes);
            const shipId=uid();
            const dep=rnd(5,60);
            db.shipments.push({
                id:shipId, organization_id:orgId, number:'SH-2026-'+(100+i),
                origin_port:from, destination_port:to, carrier:pick(['COSCO','FESCO','Maersk','SASCO']),
                departure_date:daysAgo(dep), eta:daysFromNow(rnd(-5,25)),
                status:pick(['В пути','Оформление','Прибыла','Завершена']),
                created_at:daysAgo(dep+3)
            });
            db.containers.push({
                id:uid(), organization_id:orgId, shipment_id:shipId,
                number: pick(['MSCU','TCLU','CSNU','TEMU'])+rnd(100000,999999),
                carrier: db.shipments[i].carrier, origin:from, destination:to,
                departure:db.shipments[i].departure_date, eta:db.shipments[i].eta,
                current_location:pick(['Море','Владивосток','ЖД транзит','Москва']),
                status:db.shipments[i].status, created_at:db.shipments[i].created_at
            });
        }
        // vehicles
        const brandKeys=Object.keys(BRANDS);
        for(let i=0;i<50;i++){
            const brand=pick(brandKeys); const model=pick(BRANDS[brand]);
            const stageIdx=Math.random()<0.06? -1 : rnd(0,TIMELINE_STEPS.length-1);
            const isBlocked=stageIdx===-1;
            const status=isBlocked?'BLOCKED':TIMELINE_STEPS[stageIdx];
            const purchaseDays=rnd(15,140);
            const purchaseDate=daysAgo(purchaseDays);
            const shipment=stageIdx>=2 || isBlocked ? pick(db.shipments):null;
            const container=shipment? db.containers.find(c=>c.shipment_id===shipment.id):null;
            const purchaseCNY=rnd(85000,255000);
            const rate=12.5+Math.random();
            const purchaseRUB=Math.round(purchaseCNY*rate);
            const vehId=uid();
            const customer=Math.random()<0.4? pick(db.customers):null;
            const eta = isBlocked? null : (stageIdx>=TIMELINE_STEPS.indexOf('DELIVERED')? null: daysFromNow(rnd(1,30)));
            const vehicle={
                id:vehId, organization_id:orgId, brand, model,
                year: rnd(2022,2025),
                vin: Array.from({length:17},()=>pick('ABCDEFGHJKLMNPRSTUVWXYZ0123456789'.split(''))).join(''),
                color: pick(['Белый','Чёрный','Серый','Синий','Красный']),
                order_number:'ORD-'+(1000+i),
                supplier: pick(['Guangzhou Auto Trade','Shanghai Motors Export','Ningbo Car Hub','Tianjin Auto Group']),
                purchase_price:purchaseCNY, purchase_currency:'CNY', exchange_rate:rate.toFixed(2), purchase_price_rub:purchaseRUB,
                warehouse:pick(CN_CITIES), country:'Китай', city:pick(CN_CITIES),
                container_id: container? container.id:null, shipment_id: shipment? shipment.id:null,
                location: isBlocked? 'Таможня (блок)' : (stageIdx<2? pick(CN_CITIES) : stageIdx<7? 'В пути': stageIdx<9? 'Владивосток': stageIdx<11? 'ЖД / в пути':'Москва'),
                plan_sale_price: 0, customer_id: customer? customer.id:null, manager: pick(MANAGERS),
                status, eta, is_delayed: Math.random()<0.22, delay_days: Math.random()<0.22? rnd(2,9):0,
                created_at:purchaseDate, updated_at:now()
            };
            db.vehicles.push(vehicle);
            // status history + events up to stageIdx
            const upto = isBlocked? rnd(2,6): stageIdx;
            let ts=purchaseDays;
            for(let s=0;s<=upto;s++){
                ts-=rnd(1,6); if(ts<0) ts=0;
                db.statusHistory.push({id:uid(), organization_id:orgId, vehicle_id:vehId, status:TIMELINE_STEPS[s], timestamp:daysAgo(ts), location:vehicle.location, source:'system', comment:''});
            }
            if(isBlocked){
                db.statusHistory.push({id:uid(), organization_id:orgId, vehicle_id:vehId, status:'BLOCKED', timestamp:daysAgo(1), location:vehicle.location, source:'manager', comment:'Требуются дополнительные документы'});
            }
            // expenses
            let total=purchaseRUB;
            db.expenses.push({id:uid(), organization_id:orgId, vehicle_id:vehId, type:'PURCHASE', amount:purchaseRUB, currency:'RUB', date:purchaseDate, comment:'Закупочная цена'});
            const stageExpenses=[['CHINA_LOCAL',rnd(8000,20000)],['EXPORT',rnd(15000,35000)],['SEA',rnd(90000,160000)],['CUSTOMS',rnd(180000,340000)],['RAIL',rnd(40000,70000)],['TRUCK',rnd(20000,45000)],['BROKER',rnd(15000,30000)],['STORAGE',rnd(5000,18000)]];
            const nAdd = isBlocked? 3 : Math.min(stageExpenses.length, Math.floor(upto/1.4));
            for(let k=0;k<nAdd;k++){ total+=stageExpenses[k][1]; db.expenses.push({id:uid(), organization_id:orgId, vehicle_id:vehId, type:stageExpenses[k][0], amount:stageExpenses[k][1], currency:'RUB', date:daysAgo(rnd(1,purchaseDays)), comment:''}); }
            vehicle.plan_sale_price = Math.round(total*(1.14+Math.random()*0.22));
            vehicle.total_cost = total;
            // documents
            if(Math.random()<0.7){
                db.documents.push({id:uid(), organization_id:orgId, vehicle_id:vehId, shipment_id:vehicle.shipment_id, name:'Инвойс '+vehicle.order_number, type:'INVOICE', date:purchaseDate, uploader:'Ахмад Каримов', status:'Загружен', dataUrl:null});
            }
            if(Math.random()<0.4){
                db.documents.push({id:uid(), organization_id:orgId, vehicle_id:vehId, shipment_id:vehicle.shipment_id, name:'Договор купли-продажи', type:'PURCHASE_CONTRACT', date:purchaseDate, uploader:'Марина Соколова', status:'Загружен', dataUrl:null});
            }
            // logistics events
            if(container){
                const evTypes=['CONTAINER_LOADED','VESSEL_DEPARTED','VESSEL_ARRIVED','CUSTOMS_STARTED','CUSTOMS_RELEASED','RAIL_DEPARTED','RAIL_ARRIVED','TRUCK_DISPATCHED','VEHICLE_DELIVERED'];
                const evCount=Math.min(evTypes.length, rnd(1,6));
                for(let e=0;e<evCount;e++){
                    db.events.push({id:uid(), organization_id:orgId, container_id:container.id, vehicle_id:vehId, event_type:evTypes[e], timestamp:daysAgo(rnd(1,purchaseDays)), location:vehicle.location, source:'MockTrackingProvider', raw_payload:{}});
                }
            }
        }
        // notifications
        const notifTexts=[
            ['Автомобиль куплен','check','green'],['Контейнер отправлен','ship','blue'],['ETA изменился','clock','amber'],
            ['Автомобиль прибыл','flag-checkered','blue'],['Началась таможня','file-shield','amber'],['Таможня завершена','circle-check','green'],
            ['Документ отсутствует','triangle-exclamation','red'],['Обнаружена задержка','triangle-exclamation','red'],['Автомобиль готов к выдаче','circle-check','green']
        ];
        for(let i=0;i<24;i++){
            const v=pick(db.vehicles); const n=pick(notifTexts);
            db.notifications.push({id:uid(), organization_id:orgId, title:n[0], vehicle_id:v.id, icon:n[1], tone:n[2], read:Math.random()<0.5, created_at:daysAgo(rnd(0,20))});
        }
        // audit logs
        const actions=['Изменил статус','Добавил расход','Загрузил документ','Создал автомобиль','Обновил цену продажи'];
        for(let i=0;i<40;i++){
            const v=pick(db.vehicles);
            db.auditLogs.push({id:uid(), organization_id:orgId, actor:pick(MANAGERS), action:pick(actions), entity:'vehicle:'+v.vin.slice(-6), old_value:'—', new_value:'—', created_at:daysAgo(rnd(0,45))});
        }
        db.session={userId,orgId};
        return db;
    }

    function doLogin(e){
        e.preventDefault();
        const email=document.getElementById('loginEmail').value.trim();
        const pass=document.getElementById('loginPass').value;
        const user=DB.users.find(u=>u.email===email && u.password===pass);
        if(!user){ document.getElementById('authErr').innerHTML='<div class="err-msg">Неверный email или пароль</div>'; return; }
        DB.session={userId:user.id, orgId:user.organization_id}; saveDB();
        navigate('#/dashboard'); renderApp();
        toast('Вы вошли как '+user.name,'user');
    }
    function doRegister(e){
        e.preventDefault();
        const orgName=document.getElementById('regOrg').value.trim();
        const name=document.getElementById('regName').value.trim();
        const email=document.getElementById('regEmail').value.trim();
        const pass=document.getElementById('regPass').value;
        if(DB.users.find(u=>u.email===email)){ document.getElementById('authErr').innerHTML='<div class="err-msg">Такой email уже зарегистрирован</div>'; return; }
        const newOrgId=uid(); const newUserId=uid();
        DB.organizations.push({id:newOrgId,name:orgName,created_at:now(),notifications:{inapp:true,telegram:false,email:false}});
        DB.users.push({id:newUserId,organization_id:newOrgId,name,email,password:pass,role:'OWNER',created_at:now()});
        DB.session={userId:newUserId, orgId:newOrgId}; saveDB();
        navigate('#/dashboard'); renderApp();
        toast('Компания создана. Добро пожаловать в CARFLOW!','circle-check');
    }

    function performSearch(q){
        q=q.trim().toLowerCase(); const box=document.getElementById('searchResults'); if(!q){ box.innerHTML=''; return; }
        let res=[];
        V().forEach(v=>{ if((v.brand+' '+v.model+' '+v.vin).toLowerCase().includes(q)) res.push({type:'Автомобиль',label:v.brand+' '+v.model+' · '+v.vin,href:'#/vehicles/'+v.id}); });
        C().forEach(c=>{ if(c.number.toLowerCase().includes(q)) res.push({type:'Контейнер',label:c.number,href:'#/shipments/'+c.shipment_id}); });
        S().forEach(s=>{ if(s.number.toLowerCase().includes(q)) res.push({type:'Поставка',label:s.number,href:'#/shipments/'+s.id}); });
        CU().forEach(c=>{ if(c.name.toLowerCase().includes(q)) res.push({type:'Клиент',label:c.name,href:'#/customers/'+c.id}); });
        res=res.slice(0,10);
        box.innerHTML = res.length? res.map(r=>`<div class="list-row" style="cursor:pointer;" onclick="closeSearch();navigate('${r.href}')"><div class="txt"><b>${esc(r.label)}</b><div class="meta">${r.type}</div></div></div>`).join('') : `<div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i>Ничего не найдено</div>`;
    }

    /* ================= VEHICLES LIST ================= */
    function setVFilter(key,val){ vehicleFilters[key]=val; vehicleFilters.page=1; renderApp(); }
    function sortV(col){ if(vehicleFilters.sort===col){ vehicleFilters.dir=vehicleFilters.dir==='asc'?'desc':'asc'; } else { vehicleFilters.sort=col; vehicleFilters.dir='asc'; } renderApp(); }
    function gotoVPage(p){ vehicleFilters.page=p; renderApp(); }

    function filteredVehicles(){
        let list=V().filter(v=>{
            if(vehicleFilters.q){
                const q=vehicleFilters.q.toLowerCase();
                if(!(v.brand+' '+v.model+' '+v.vin).toLowerCase().includes(q)) return false;
            }
            if(vehicleFilters.status && v.status!==vehicleFilters.status) return false;
            if(vehicleFilters.shipment && v.shipment_id!==vehicleFilters.shipment) return false;
            if(vehicleFilters.location && v.location!==vehicleFilters.location) return false;
            return true;
        });
        list.sort((a,b)=>{
            let av=a[vehicleFilters.sort], bv=b[vehicleFilters.sort];
            if(vehicleFilters.sort==='profit'){ av=(a.plan_sale_price||0)-vehicleCost(a); bv=(b.plan_sale_price||0)-vehicleCost(b); }
            if(typeof av==='string') av=av.toLowerCase(); if(typeof bv==='string') bv=bv.toLowerCase();
            if(av<bv) return vehicleFilters.dir==='asc'?-1:1;
            if(av>bv) return vehicleFilters.dir==='asc'?1:-1;
            return 0;
        });
        return list;
    }

            </table>
        </div>
        <div class="pagination">
            <span>Показано ${pageItems.length? start+1:0}–${start+pageItems.length} из ${total}</span>

            </div>

    function submitVehicle(e){
        e.preventDefault();
        const id=uid();
        const v={
            id, organization_id:orgId(),
            brand:document.getElementById('fBrand').value, model:document.getElementById('fModel').value,
            year:+document.getElementById('fYear').value, vin:document.getElementById('fVin').value.toUpperCase(),
            color:document.getElementById('fColor').value, order_number:document.getElementById('fOrder').value,
            supplier:document.getElementById('fSupplier').value,
            purchase_price:+document.getElementById('fPrice').value, purchase_currency:document.getElementById('fCurrency').value,
            exchange_rate:+document.getElementById('fRate').value,
            purchase_price_rub: Math.round(+document.getElementById('fPrice').value * (+document.getElementById('fRate').value||1)),
            city:document.getElementById('fCity').value, country:document.getElementById('fCountry').value,
            shipment_id:document.getElementById('fShipment').value||null, container_id:null,
            location:document.getElementById('fCity').value||'Китай',
            status:document.getElementById('fStatus').value,
            plan_sale_price:+document.getElementById('fSalePrice').value||0,
            manager:document.getElementById('fManager').value, customer_id:null, eta:null,
            is_delayed:false, delay_days:0, created_at:now(), updated_at:now()
        };
        DB.vehicles.push(v);
        DB.expenses.push({id:uid(), organization_id:orgId(), vehicle_id:id, type:'PURCHASE', amount:v.purchase_price_rub, currency:'RUB', date:now(), comment:'Закупочная цена'});
        DB.statusHistory.push({id:uid(), organization_id:orgId(), vehicle_id:id, status:v.status, timestamp:now(), location:v.location, source:'manager', comment:'Автомобиль создан'});
        addNotification('Автомобиль куплен', id, 'check', 'green');
        logAudit('Создал автомобиль','vehicle:'+v.vin.slice(-6),'—',v.brand+' '+v.model);
        saveDB(); closeModal(); navigate('#/vehicles/'+id); renderApp();
        toast('Автомобиль добавлен');
    }

    function renderVehicleTimeline(v){
        const hist=HIST(v.id);
        const doneStatuses=hist.map(h=>h.status);
        const currentIdx=TIMELINE_STEPS.indexOf(v.status);
        return `<div class="card"><div class="section-title"><i class="fa-solid fa-timeline"></i>История статусов (неизменяема)</div>
        <div class="timeline">
        ${TIMELINE_STEPS.map((s,i)=>{
            const h=hist.find(x=>x.status===s);
            const cls = h && i<currentIdx? 'done' : (s===v.status?'current':'pending');
            return `<div class="t-item ${cls}">
                <b>${TIMELINE_LABELS[s]}</b>
                <div class="meta">${h? fmtDateTime(h.timestamp)+' · '+esc(h.location)+(h.comment?' · '+esc(h.comment):'') : 'Ожидается'}</div>
            </div>`;
        }).join('')}
        ${v.status==='BLOCKED'?`<div class="t-item current"><b>Блокирован</b><div class="meta">${hist.filter(h=>h.status==='BLOCKED').map(h=>fmtDateTime(h.timestamp)+' · '+esc(h.comment||'')).join('') }</div></div>`:''}
        </div></div>`;
    }

    function changeVehicleStatus(id,newStatus){
        if(!newStatus) return;
        const v=DB.vehicles.find(x=>x.id===id); if(!v) return;
        const old=v.status;
        v.status=newStatus; v.updated_at=now();
        DB.statusHistory.push({id:uid(), organization_id:orgId(), vehicle_id:id, status:newStatus, timestamp:now(), location:v.location, source:'manager', comment:''});
        logAudit('Изменил статус','vehicle:'+v.vin.slice(-6),STATUS_META[old]?.label||old,STATUS_META[newStatus]?.label||newStatus);
        addNotification(STATUS_META[newStatus]?.label+': '+v.brand+' '+v.model, id, 'flag-checkered','blue');
        saveDB(); renderApp();
        toast('Статус обновлён: '+(STATUS_META[newStatus]?.label||newStatus));

        <form onsubmit="submitDocument(event,'${vehId}')">

    function submitDocument(e,vehId){
        e.preventDefault();
        const name=document.getElementById('docName').value; const type=document.getElementById('docType').value;
        const fileInput=document.getElementById('docFile');
        const save=(dataUrl)=>{
            DB.documents.push({id:uid(), organization_id:orgId(), vehicle_id:vehId, name, type, date:now(), uploader:currentUser()?.name||'—', status:'Загружен', dataUrl:dataUrl||null});
            logAudit('Загрузил документ','vehicle:'+vehId.slice(-6),'—',name);
            saveDB(); closeModal(); renderApp(); toast('Документ загружен','file-arrow-up');
        };
        if(fileInput.files[0]){ const reader=new FileReader(); reader.onload=()=>save(reader.result); reader.readAsDataURL(fileInput.files[0]); }
        else save(null);
    }
    function deleteDocument(id){ DB.documents=DB.documents.filter(d=>d.id!==id); saveDB(); renderApp(); toast('Документ удалён','trash'); }

    function shareTracking(vehId){
        let link=DB.trackingLinks.find(t=>t.vehicle_id===vehId);

        const url=location.origin+location.pathname+'#/track/'+link.token;
        openModal(`<div class="modal-head"><h3>Публичная ссылка отслеживания</h3><i class="fa-solid fa-xmark" onclick="closeModal()"></i></div>

    /* ================= MAP ================= */
    let mapFilter='ALL';
    function setMapFilter(f){ mapFilter=f; renderApp(); }
    function renderMap(){
        const conts=C().filter(c=>{
            if(mapFilter==='ALL') return true;
            if(mapFilter==='TRANSIT') return ['В пути','Море'].includes(c.status)||c.current_location==='Море';
            if(mapFilter==='SEA') return c.current_location==='Море';
            if(mapFilter==='RAIL') return c.current_location==='ЖД транзит';
            if(mapFilter==='CUSTOMS') return c.status==='Оформление';
            if(mapFilter==='READY') return c.status==='Завершена';
            return true;
        });
        const nodeX={'Китай':90,'Море':330,'Владивосток':560,'ЖД транзит':780,'Москва':980};
        const posFor=(loc)=> nodeX[loc]!==undefined? nodeX[loc] : (nodeX['Китай']);
        return `
        <h1 class="page-title">Карта</h1>
        <p class="page-sub">Схема маршрутов доставки: Китай → море → Владивосток → ЖД → Москва</p>
        <div class="map-legend">
            <button class="${mapFilter==='ALL'?'active':''}" onclick="setMapFilter('ALL')">Все</button>
            <button class="${mapFilter==='TRANSIT'?'active':''}" onclick="setMapFilter('TRANSIT')">В пути</button>
            <button class="${mapFilter==='SEA'?'active':''}" onclick="setMapFilter('SEA')">Море</button>
            <button class="${mapFilter==='RAIL'?'active':''}" onclick="setMapFilter('RAIL')">ЖД</button>
            <button class="${mapFilter==='CUSTOMS'?'active':''}" onclick="setMapFilter('CUSTOMS')">Таможня</button>
            <button class="${mapFilter==='READY'?'active':''}" onclick="setMapFilter('READY')">Готовы</button>
        </div>
        <div class="map-wrap">
            <svg width="100%" height="260" viewBox="0 0 1060 260" style="min-width:900px;">
                <line x1="90" y1="130" x2="980" y2="130" stroke="#E0E5E9" stroke-width="3" stroke-dasharray="6 6"/>
                ${Object.entries(nodeX).map(([label,x])=>`
                    <circle cx="${x}" cy="130" r="7" fill="#101820"/>
                    <text x="${x}" y="160" font-size="12" fill="#141A21" text-anchor="middle" font-weight="600">${label}</text>
                `).join('')}
                ${conts.map((c,i)=>{
                    const x=posFor(c.current_location); const y=130 - 26 - (i%3)*16;
                    return `<circle cx="${x}" cy="${y}" r="6" fill="#D9611E"><title>${c.number}</title></circle>
                    <text x="${x}" y="${y-10}" font-size="10" fill="#7F8A96" text-anchor="middle">${esc(c.number.slice(-6))}</text>`;
                }).join('')}
            </svg>
        </div>
        <div class="card" style="margin-top:16px;">
            <div class="section-title"><i class="fa-solid fa-box"></i>Контейнеры на маршруте (${conts.length})</div>
            ${conts.map(c=>`<div class="list-row"><div class="dot" style="background:var(--accent)"></div><div class="txt"><b class="mono">${esc(c.number)}</b><div class="meta">${esc(c.carrier)} · ${esc(c.current_location)}</div></div><div class="time">${fmtDate(c.eta)}</div></div>`).join('')||'<div class="empty-state"><i class="fa-solid fa-box"></i>Нет контейнеров по фильтру</div>'}
        </div>`;
    }

    /* ================= FINANCE ================= */
    function renderFinance(){
        const vs=V(); const exps=EXP();
        const capital=vs.reduce((s,v)=>s+vehicleCost(v),0);
        const revenue=vs.reduce((s,v)=>s+(v.plan_sale_price||0),0);
        const profit=revenue-capital;
        const byType={}; exps.forEach(e=>{byType[e.type]=(byType[e.type]||0)+e.amount;});
        return `
        <h1 class="page-title">Финансы</h1>
        <p class="page-sub">Капитал, расходы по категориям и прогноз прибыли по всему автопарку</p>
        <div class="grid grid-4" style="margin-bottom:20px;">
            <div class="kpi-card fin-card"><div class="lb">Капитал в обороте</div><div class="val">${fmtMoney(capital)}</div></div>
            <div class="kpi-card fin-card"><div class="lb">Ожидаемая выручка</div><div class="val">${fmtMoney(revenue)}</div></div>
            <div class="kpi-card fin-card"><div class="lb">Плановая прибыль</div><div class="val green">${fmtMoney(profit)}</div></div>
            <div class="kpi-card fin-card"><div class="lb">Средняя маржа</div><div class="val">${revenue? (profit/revenue*100).toFixed(1):0}%</div></div>
        </div>
        <div class="card">
            <div class="section-title"><i class="fa-solid fa-chart-pie"></i>Расходы по категориям</div>
            ${EXPENSE_TYPES.map(t=>{
                const val=byType[t]||0; const pct=capital? (val/capital*100):0;
                return `<div style="margin-bottom:10px;">
                    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><b>${EXPENSE_LABELS[t]}</b><span style="color:var(--secondary);">${fmtMoney(val)}</span></div>
                    <div style="height:6px;background:var(--bg);border-radius:4px;overflow:hidden;"><div style="height:100%;width:${Math.min(100,pct)}%;background:var(--accent);"></div></div>
                </div>`;
            }).join('')}
        </div>`;
    }

    /* ================= DOCUMENTS ================= */
    function setDocFilter(k,v){ docFilters[k]=v; renderApp(); }
    function renderDocuments(){
        let docs=DOCS();
        if(docFilters.q) docs=docs.filter(d=>d.name.toLowerCase().includes(docFilters.q.toLowerCase()));
        if(docFilters.type) docs=docs.filter(d=>d.type===docFilters.type);
        return `
        <h1 class="page-title">Документы</h1>
        <p class="page-sub">Все документы по автомобилям и поставкам компании</p>
        <div class="toolbar">
            <input type="text" placeholder="Поиск по названию…" value="${esc(docFilters.q)}" oninput="setDocFilter('q',this.value)">
            <select onchange="setDocFilter('type',this.value)"><option value="">Все типы</option>${DOC_TYPES.map(t=>`<option value="${t}" ${docFilters.type===t?'selected':''}>${DOC_LABELS[t]}</option>`).join('')}</select>
        </div>
        <div class="table-wrap"><table>
            <thead><tr><th>Документ</th><th>Тип</th><th>Автомобиль</th><th>Дата</th><th>Автор</th><th>Статус</th></tr></thead>
            <tbody>${docs.length?docs.map(d=>{
                const veh=V().find(v=>v.id===d.vehicle_id);
                return `<tr class="clickable" onclick="${veh?`navigate('#/vehicles/${veh.id}')`:''}">
                    <td class="cell-strong"><i class="fa-solid fa-file-lines" style="color:var(--secondary);margin-right:8px;"></i>${esc(d.name)}</td>
                    <td class="cell-sub">${DOC_LABELS[d.type]||d.type}</td>
                    <td>${veh?esc(veh.brand+' '+veh.model):'—'}</td><td>${fmtDate(d.date)}</td><td class="cell-sub">${esc(d.uploader)}</td>
                    <td><span class="badge" style="background:var(--green-soft);color:var(--green);">${esc(d.status)}</span></td>
                </tr>`;
            }).join(''):`<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--secondary);">Документов нет</td></tr>`}</tbody>
        </table></div>`;
    }

    /* ================= CUSTOMERS ================= */
    function setCFilter(k,v){ customerFilters[k]=v; customerFilters.page=1; renderApp(); }
    function renderCustomersList(){
        let list=CU().filter(c=> !customerFilters.q || c.name.toLowerCase().includes(customerFilters.q.toLowerCase()));
        const total=list.length; const start=(customerFilters.page-1)*customerFilters.pageSize;
        const pageItems=list.slice(start,start+customerFilters.pageSize);
        const pages=Math.max(1,Math.ceil(total/customerFilters.pageSize));
        return `
        <div class="row-between"><div><h1 class="page-title">Клиенты</h1><p class="page-sub" style="margin:0;">Всего клиентов: ${CU().length}</p></div>
            <button class="btn btn-accent" onclick="openAddCustomerModal()"><i class="fa-solid fa-plus"></i>Добавить клиента</button>
        </div>
        <div class="toolbar"><input type="text" placeholder="Поиск клиента…" value="${esc(customerFilters.q)}" oninput="setCFilter('q',this.value)"></div>
        <div class="table-wrap"><table>
            <thead><tr><th>Имя</th><th>Телефон</th><th>Email</th><th>Тип</th><th>Менеджер</th><th>Авто</th><th>Сумма заказа</th></tr></thead>
            <tbody>${pageItems.length?pageItems.map(c=>{
                const vehs=V().filter(v=>v.customer_id===c.id);
                const order=vehs.reduce((s,v)=>s+(v.plan_sale_price||0),0);
                return `<tr class="clickable" onclick="navigate('#/customers/${c.id}')">
                    <td class="cell-strong">${esc(c.name)}</td><td class="cell-sub">${esc(c.phone)}</td><td class="cell-sub">${esc(c.email)}</td>
                    <td>${CUSTOMER_LABELS[c.type]}</td><td class="cell-sub">${esc(c.manager)}</td><td>${vehs.length}</td><td>${fmtMoney(order)}</td>
                </tr>`;
            }).join(''):`<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--secondary);">Клиентов нет</td></tr>`}</tbody>
        </table></div>
        <div class="pagination"><span>Показано ${pageItems.length?start+1:0}–${start+pageItems.length} из ${total}</span>
        <div class="pg-btns">${Array.from({length:pages},(_,i)=>i+1).map(p=>`<button class="${p===customerFilters.page?'active':''}" onclick="customerFilters.page=${p};renderApp();">${p}</button>`).join('')}</div></div>
        `;
    }
    function openAddCustomerModal(){
        openModal(`<div class="modal-head"><h3>Добавить клиента</h3><i class="fa-solid fa-xmark" onclick="closeModal()"></i></div>
        <form onsubmit="submitCustomer(event)"><div class="modal-body">
            <div class="field"><label>Имя</label><input id="cuName" required></div>
            <div class="field"><label>Телефон</label><input id="cuPhone" required></div>
            <div class="field"><label>Email</label><input id="cuEmail" type="email"></div>
            <div class="field"><label>Тип клиента</label><select id="cuType"><option value="PRIVATE">Частное лицо</option><option value="DEALER">Дилер</option><option value="CORPORATE">Корпоративный</option></select></div>
            <div class="field"><label>Менеджер</label><input id="cuManager" value="${esc(currentUser()?.name||'')}"></div>
        </div><div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Отмена</button><button type="submit" class="btn btn-accent">Сохранить</button></div></form>`);
    }
    function submitCustomer(e){
        e.preventDefault(); const id=uid();
        DB.customers.push({id, organization_id:orgId(), name:document.getElementById('cuName').value, phone:document.getElementById('cuPhone').value, email:document.getElementById('cuEmail').value, type:document.getElementById('cuType').value, manager:document.getElementById('cuManager').value, created_at:now()});
        saveDB(); closeModal(); navigate('#/customers/'+id); renderApp(); toast('Клиент добавлен');
    }
    function renderCustomerDetail(id){
        const c=CU().find(x=>x.id===id); if(!c) return `<div class="empty-state"><i class="fa-solid fa-user"></i>Клиент не найден</div>`;
        const vehs=V().filter(v=>v.customer_id===id);
        const order=vehs.reduce((s,v)=>s+(v.plan_sale_price||0),0);
        const paid=Math.round(order*0.4);
        return `<button class="btn btn-ghost btn-sm" onclick="navigate('#/customers')" style="margin-bottom:16px;"><i class="fa-solid fa-arrow-left"></i>Все клиенты</button>
        <h1 class="page-title">${esc(c.name)}</h1>
        <p class="page-sub">${CUSTOMER_LABELS[c.type]} · ${esc(c.phone)} · ${esc(c.email)}</p>
        <div class="grid grid-3" style="margin-bottom:20px;">
            <div class="kpi-card fin-card"><div class="lb">Сумма заказа</div><div class="val">${fmtMoney(order)}</div></div>
            <div class="kpi-card fin-card"><div class="lb">Оплачено</div><div class="val green">${fmtMoney(paid)}</div></div>
            <div class="kpi-card fin-card"><div class="lb">Остаток</div><div class="val">${fmtMoney(order-paid)}</div></div>
        </div>
        <div class="card"><div class="section-title"><i class="fa-solid fa-car"></i>Автомобили клиента</div>
        ${vehs.length?vehs.map(v=>`<div class="list-row" style="cursor:pointer;" onclick="navigate('#/vehicles/${v.id}')"><div class="txt"><b>${esc(v.brand)} ${esc(v.model)}</b><div class="meta">${esc(v.vin.slice(-8))}</div></div><div class="time">${statusBadge(v.status)}</div></div>`).join(''):`<div class="empty-state"><i class="fa-solid fa-car"></i>Автомобилей нет</div>`}
        </div>`;
    }

    /* ================= SETTINGS ================= */
    let settingsTab='org';
    function renderSettings(){
        const org=currentOrg(); const users=DB.users.filter(u=>u.organization_id===orgId());
        if(!org.notifications) org.notifications={inapp:true,telegram:false,email:false};
        const nf=org.notifications;
        return `<h1 class="page-title">Настройки</h1><p class="page-sub">Организация, пользователи, роли, интеграции</p>
        <div class="tabs">
            <button class="${settingsTab==='org'?'active':''}" onclick="settingsTab='org';renderApp();">Организация</button>
            <button class="${settingsTab==='users'?'active':''}" onclick="settingsTab='users';renderApp();">Пользователи</button>
            <button class="${settingsTab==='notif'?'active':''}" onclick="settingsTab='notif';renderApp();">Уведомления</button>
            <button class="${settingsTab==='integr'?'active':''}" onclick="settingsTab='integr';renderApp();">Интеграции</button>
            <button class="${settingsTab==='audit'?'active':''}" onclick="settingsTab='audit';renderApp();">Журнал изменений</button>
            <button class="${settingsTab==='billing'?'active':''}" onclick="settingsTab='billing';renderApp();">Тариф</button>
        </div>
        ${settingsTab==='org'?`<div class="card" style="max-width:480px;">
            <div class="field"><label>Название организации</label><input id="orgNameInput" value="${esc(org?.name||'')}"></div>
            <div class="field"><label>Дата создания</label><input value="${fmtDate(org?.created_at)}" readonly></div>
            <button class="btn btn-accent" onclick="saveOrgName()"><i class="fa-solid fa-floppy-disk"></i>Сохранить</button>
        </div>`:''}
        ${settingsTab==='users'?`<div class="card">
            <div class="row-between" style="margin-bottom:6px;">
                <div class="section-title" style="margin:0;"><i class="fa-solid fa-users"></i>Пользователи</div>
                <button class="btn btn-ghost btn-sm" onclick="openAddUserModal()"><i class="fa-solid fa-plus"></i>Добавить</button>
            </div>
            ${users.map(u=>`<div class="list-row"><div class="txt"><b>${esc(u.name)}</b><div class="meta">${esc(u.email)}</div></div><div class="time"><span class="badge" style="background:var(--blue-soft);color:var(--blue);">${u.role}</span></div></div>`).join('')}
        </div>`:''}
        ${settingsTab==='notif'?`<div class="card"><p style="color:var(--secondary);font-size:13px;">Выберите каналы, по которым будут приходить уведомления о статусах и событиях.</p>
            <div class="list-row"><div class="txt"><b>In-app</b><div class="meta">Уведомления внутри приложения</div></div><div class="time"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" ${nf.inapp?'checked':''} onchange="toggleNotifChannel('inapp',this.checked)"><span>${nf.inapp?'Активно':'Отключено'}</span></label></div></div>
            <div class="list-row"><div class="txt"><b>Telegram</b><div class="meta">Отправка через Telegram-бота</div></div><div class="time"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" ${nf.telegram?'checked':''} onchange="toggleNotifChannel('telegram',this.checked)"><span>${nf.telegram?'Активно':'Отключено'}</span></label></div></div>
            <div class="list-row"><div class="txt"><b>Email</b><div class="meta">Отправка на почту</div></div><div class="time"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" ${nf.email?'checked':''} onchange="toggleNotifChannel('email',this.checked)"><span>${nf.email?'Активно':'Отключено'}</span></label></div></div>
        </div>`:''}
        ${settingsTab==='integr'?`<div class="card"><p style="color:var(--secondary);font-size:13px;">Архитектура TrackingProvider готова для подключения реальных API контейнерного и ЖД трекинга. Сейчас используется MockTrackingProvider.</p></div>`:''}
        ${settingsTab==='audit'?`<div class="card">${AUDIT().slice(0,40).map(a=>`<div class="list-row"><div class="txt"><b>${esc(a.actor)}</b><div class="meta">${esc(a.action)} · ${esc(a.entity)}</div></div><div class="time">${fmtDateTime(a.created_at)}</div></div>`).join('')||'<div class="empty-state"><i class="fa-solid fa-clock-rotate-left"></i>Пусто</div>'}</div>`:''}
        ${settingsTab==='billing'?`<div class="card"><p style="color:var(--secondary);font-size:13px;">Тариф: <b style="color:var(--text);">Demo (бесплатно)</b>. Оплата и биллинг будут доступны позже.</p></div>`:''}
        `;
    }
    function saveOrgName(){
        const org=currentOrg(); const val=document.getElementById('orgNameInput').value.trim();
        if(!val){ toast('Название не может быть пустым','triangle-exclamation'); return; }
        org.name=val; saveDB(); renderApp(); toast('Название организации сохранено','circle-check');
    }
    function toggleNotifChannel(channel,val){
        const org=currentOrg(); if(!org.notifications) org.notifications={inapp:true,telegram:false,email:false};
        org.notifications[channel]=val; saveDB(); renderApp();
        toast((val?'Включено: ':'Отключено: ')+({inapp:'In-app',telegram:'Telegram',email:'Email'})[channel]);
    }
    function openAddUserModal(){
        openModal(`<div class="modal-head"><h3>Добавить пользователя</h3><i class="fa-solid fa-xmark" onclick="closeModal()"></i></div>
        <form onsubmit="submitUser(event)"><div class="modal-body">
            <div class="field"><label>Имя</label><input id="usrName" required></div>
            <div class="field"><label>Email</label><input id="usrEmail" type="email" required></div>
            <div class="field"><label>Пароль</label><input id="usrPass" type="password" required minlength="4"></div>
            <div class="field"><label>Роль</label><select id="usrRole"><option value="MANAGER">Менеджер</option><option value="OWNER">Владелец</option><option value="ACCOUNTANT">Бухгалтер</option></select></div>
        </div><div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Отмена</button><button type="submit" class="btn btn-accent">Добавить</button></div></form>`);
    }
    function submitUser(e){
        e.preventDefault();
        const email=document.getElementById('usrEmail').value.trim();
        if(DB.users.find(u=>u.email===email)){ toast('Такой email уже существует','triangle-exclamation'); return; }
        DB.users.push({id:uid(), organization_id:orgId(), name:document.getElementById('usrName').value, email, password:document.getElementById('usrPass').value, role:document.getElementById('usrRole').value, created_at:now()});
        saveDB(); closeModal(); renderApp(); toast('Пользователь добавлен');
    }

    /* ================= PUBLIC TRACKING ================= */
    function renderPublicTracking(token){
        const link=DB.trackingLinks.find(t=>t.token===token);
        if(!link) return `<div class="track-wrap"><div class="empty-state" style="padding-top:100px;"><i class="fa-solid fa-triangle-exclamation"></i>Ссылка не найдена или устарела</div></div>`;
        const v=DB.vehicles.find(x=>x.id===link.vehicle_id);
        if(!v) return `<div class="track-wrap"><div class="empty-state" style="padding-top:100px;"><i class="fa-solid fa-triangle-exclamation"></i>Автомобиль не найден</div></div>`;
        const hist=HIST(v.id); const currentIdx=TIMELINE_STEPS.indexOf(v.status);
        return `<div class="track-wrap">
            <div class="track-top"><div class="inner"><i class="fa-solid fa-truck-fast" style="color:#D9611E;"></i><b>CARFLOW TRACKING</b></div></div>
            <div class="track-container">
                <div class="track-card">
                    <div style="color:var(--secondary);font-size:12px;text-transform:uppercase;font-weight:700;letter-spacing:.4px;margin-bottom:6px;">Ваш автомобиль</div>
                    <h1 style="margin:0 0 10px;font-size:24px;">${esc(v.brand)} ${esc(v.model)} ${v.year}</h1>
                    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">
                        ${statusBadge(v.status)}
                        <span style="color:var(--secondary);font-size:13px;">VIN: ****${esc(v.vin.slice(-6))}</span>
                        <span style="color:var(--secondary);font-size:13px;">ETA: <b style="color:var(--text);">${fmtDate(v.eta)}</b></span>
                    </div>
                </div>
                <div class="track-card">
                    <div class="section-title"><i class="fa-solid fa-route"></i>Маршрут</div>
                    <p style="color:var(--secondary);font-size:13px;margin:0;">Китай → Морской путь → Владивосток → ЖД транзит → Москва</p>
                </div>
                <div class="track-card">
                    <div class="section-title"><i class="fa-solid fa-timeline"></i>Статус доставки</div>
                    <div class="timeline">
                    ${TIMELINE_STEPS.map((s,i)=>{
                        const h=hist.find(x=>x.status===s);
                        const cls = h && i<currentIdx? 'done' : (s===v.status?'current':'pending');
                        return `<div class="t-item ${cls}"><b>${TIMELINE_LABELS[s]}</b><div class="meta">${h?fmtDate(h.timestamp):'Ожидается'}</div></div>`;
                    }).join('')}
                    </div>
                </div>
            </div>
        </div>`;
    }
    </script>
</body>
</html>
